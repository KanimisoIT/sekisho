# 関所(sekisho)の本体。各アプリのリポジトリは caller/sekisho-call.yml を置いて、ここを main で呼ぶ。
# 必須にするのは最後の job「verdict」だけ(呼び出し側の名と合わせて "sekisho / verdict")。
# どの段も飛ばさない。当てはまらない段は中で何もせずに成功して終わる。
# 判定に使う台本と設定(zizmor・actionlint)は、アプリ側ではなく本体の物を使う。
name: sekisho

on:
  workflow_call:
    inputs:
      sekisho_ref:
        description: この本体の版(呼び出し側の uses と同じ物)
        type: string
        default: main

permissions:
  contents: read

env:
  SEKISHO_REPO: KanimisoIT/sekisho
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  OSV_IMAGE: ghcr.io/google/osv-scanner:v2.7.1

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 秘密の混入(gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --exit-code 2 --no-banner

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SEKISHO_REPO }}
          ref: ${{ inputs.sekisho_ref }}
          path: .sekisho-body
          persist-credentials: false
      - name: 自動検査の手順そのもの(actionlint・zizmor。設定は本体の物)
        run: |
          if [ ! -d .github/workflows ]; then echo "手順の置き場が無い"; exit 0; fi
          python3 -m pip install --quiet "actionlint-py==1.7.12.25" "zizmor==1.33.1"
          actionlint -config-file .sekisho-body/actionlint.yaml
          zizmor --offline --config .sekisho-body/zizmor.yml --min-severity medium .github/workflows

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 依存の既知の脆弱性(osv-scanner)
        run: |
          set +e
          docker run --rm -v "$PWD:/src" "$OSV_IMAGE" scan source -r /src
          code=$?
          # 128 は「依存の一覧が無い」。依存の無いリポジトリは通す
          if [ "$code" -eq 128 ]; then echo "依存の一覧が無い"; exit 0; fi
          exit "$code"

  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SEKISHO_REPO }}
          ref: ${{ inputs.sekisho_ref }}
          path: .sekisho-body
          persist-credentials: false
      - name: 抜け道・足すだけ・経緯の注釈・版の一致・指摘の束
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REPO_PUBLIC: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          python3 -I .sekisho-body/scripts/guard.py --base "$BASE_SHA" --head HEAD
          python3 -I .sekisho-body/scripts/comments.py --base "$BASE_SHA" --head HEAD
          python3 -I .sekisho-body/scripts/version_sync.py
          python3 -I .sekisho-body/scripts/run_checks.py

  lang:
    name: lang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package.json') != ''
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        with:
          python-version: '3.13'
      - name: JS・TS(静的検査・型・試験)
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "ロックファイルが無い"; exit 1; fi
          npm run --if-present lint
          if [ -f tsconfig.json ]; then npx --no-install tsc --noEmit; fi
          npm run --if-present test
      - name: Python(静的検査・型・試験)
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          python -m pip install --quiet "ruff==0.17.6" pyright pytest
          if [ -f requirements.txt ]; then python -m pip install --quiet -r requirements.txt; fi
          ruff check .
          pyright
          if [ -d tests ]; then pytest -q; fi
      - name: 当てはまらない
        if: hashFiles('package.json', 'pyproject.toml', 'requirements.txt') == ''
        run: echo "JS・TS・Python の目印が無いので、言語の段は無し"

  verdict:
    name: verdict
    runs-on: ubuntu-latest
    needs: [secrets, workflows, deps, guard, lang]
    if: ${{ always() }}
    steps:
      - name: 関所の判定(どれか一つでも成功以外なら赤)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          bad = {k: v['result'] for k, v in needs.items() if v['result'] != 'success'}
          lines = ['## 関所'] + [f'- {k}: {v}' for k, v in needs.items() for v in [v['result']]]
          if bad:
              lines.append('')
              lines.append('赤。理由は `gh run view --log-failed` で読む。落ちた段: ' + '、'.join(bad))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          raise SystemExit(1 if bad else 0)
          PY
