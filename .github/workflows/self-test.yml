# 関所の本体の検査の検査。わざと誤りを入れた見本(tests/spec/)が、変えたあとの台本で全部赤のままかを試す。
# 抜け道の封じは取り込み先(base)の台本で判定する。同じ変更の中で判定役を弱められないように。
# 見本は足すだけ。新しい見本は新しいファイルに書く。
name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    name: self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: 検査の検査・抜け道の封じ・手順の検査
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SEKISHO_SELF: 'true'
        run: |
          python -m pip install --quiet "pytest==9.2.0" "actionlint-py==1.7.12.25" "zizmor==1.33.1"
          python -m pytest -q tests
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            mkdir -p /tmp/base && git archive "$BASE_SHA" scripts actionlint.yaml zizmor.yml | tar -x -C /tmp/base
            JUDGE=/tmp/base
          else
            JUDGE=.
          fi
          python -I "$JUDGE/scripts/guard.py" --base "$BASE_SHA" --head HEAD
          python -I "$JUDGE/scripts/comments.py" --base "$BASE_SHA" --head HEAD
          actionlint -config-file "$JUDGE/actionlint.yaml"
          zizmor --offline --config "$JUDGE/zizmor.yml" --min-severity medium .github/workflows
